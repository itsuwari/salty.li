name: Build portable Lean 4.32

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      LEAN_VERSION: v4.32.0
      TARGET_ZIP_BYTES: "470000000"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build-host tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            zstd 7zip unzip strace libc++-dev libc++abi-dev libuv1-dev

      - name: Download and test full Lean
        run: |
          set -euxo pipefail
          root="$GITHUB_WORKSPACE/stage/lean-portable"
          mkdir -p "$GITHUB_WORKSPACE/work" "$root"
          cd "$GITHUB_WORKSPACE/work"
          curl -fL --retry 5 --retry-delay 5 \
            -o lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/${LEAN_VERSION}/lean-${LEAN_VERSION#v}-linux.tar.zst"
          tar --zstd -xf lean.tar.zst
          mv "lean-${LEAN_VERSION#v}-linux" "$root/toolchain"
          rm lean.tar.zst

          "$root/toolchain/bin/lean" --version
          "$root/toolchain/bin/lake" --version
          cat > /tmp/Basic.lean <<'EOF'
          def add (a b : Nat) : Nat := a + b

          theorem add_zero (n : Nat) : add n 0 = n := by
            simp [add]

          def main : IO Unit :=
            IO.println s!"2 + 3 = {add 2 3}"
          EOF
          "$root/toolchain/bin/lean" --run /tmp/Basic.lean | tee /tmp/basic-full.out
          grep -Fx '2 + 3 = 5' /tmp/basic-full.out

      - name: Fetch, test, and trace Mathlib cache
        run: |
          set -euxo pipefail
          root="$GITHUB_WORKSPACE/stage/lean-portable"
          export PATH="$root/toolchain/bin:$PATH"
          cd "$root"
          git clone --depth 1 --branch "$LEAN_VERSION" \
            https://github.com/leanprover-community/mathlib4.git mathlib
          cd mathlib
          lake exe cache get

          cat > PortableProbe.lean <<'EOF'
          import Mathlib.Tactic
          import Mathlib.Data.Real.Basic
          import Mathlib.LinearAlgebra.Basis.Basic
          import Mathlib.Analysis.Calculus.Deriv.Basic

          example : (2 : Nat) + 3 = 5 := by norm_num

          def main : IO Unit := IO.println "mathlib-ok"
          EOF
          strace -f -e trace=file -o /tmp/mathlib-files.trace \
            lake env lean --run PortableProbe.lean | tee /tmp/mathlib-full.out
          grep -Fx 'mathlib-ok' /tmp/mathlib-full.out

          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path.cwd().resolve()
          keep = set()
          for line in Path('/tmp/mathlib-files.trace').read_text(errors='ignore').splitlines():
              for raw in re.findall(r'"([^"]+\.(?:olean|so))"', line):
                  p = Path(raw)
                  candidates = [p] if p.is_absolute() else [root / p]
                  for candidate in candidates:
                      try:
                          resolved = candidate.resolve()
                          if resolved.is_file():
                              keep.add(str(resolved.relative_to(root)))
                      except (OSError, ValueError):
                          pass
          required = sorted(
              p for p in keep
              if p.startswith('.lake/build/') or p.startswith('.lake/packages/')
          )
          Path('/tmp/mathlib-required-cache.txt').write_text(
              '\n'.join(required) + '\n', encoding='utf-8')
          print(f'retaining {len(required)} traced Mathlib/dependency cache files')
          if not any(p.startswith('.lake/build/') and p.endswith('.olean') for p in required):
              raise SystemExit('trace did not capture Mathlib .olean files')
          PY

      - name: Trim, curate, assemble, and retest
        run: |
          set -euxo pipefail
          root="$GITHUB_WORKSPACE/stage/lean-portable"
          export PATH="$root/toolchain/bin:$PATH"

          cd "$root/mathlib"
          rm -rf .github docs Archive Counterexamples MathlibTest test tests
          find .lake -type f \( \
            -name '*.ilean' -o -name '*.c' -o -name '*.o' -o -name '*.bc' \
            -o -name '*.a' -o -name '*.trace' \
          \) -delete || true

          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd().resolve()
          keep = {
              line.strip()
              for line in Path('/tmp/mathlib-required-cache.txt').read_text().splitlines()
              if line.strip()
          }
          build = root / '.lake' / 'build'
          removed = 0
          retained = 0
          if build.exists():
              for p in build.rglob('*'):
                  if not p.is_file() or p.suffix not in {'.olean', '.so'}:
                      continue
                  rel = str(p.resolve().relative_to(root))
                  if rel in keep:
                      retained += 1
                  else:
                      p.unlink()
                      removed += 1
          print(f'curated root Mathlib cache: retained={retained}, removed={removed}')
          if retained == 0:
              raise SystemExit('curated cache is empty')
          PY
          find .lake -type d -empty -delete || true

          cd "$root/toolchain"
          rm -rf share/doc share/man src lib/clang include/clang
          rm -f bin/clang bin/clang++ bin/clang-cl bin/clang-cpp \
            bin/ld.lld bin/lld bin/lld-link bin/wasm-ld
          find lib/lean -type f \( \
            -name '*.ilean' -o -name '*.c' -o -name '*.o' -o -name '*.bc' \
          \) -delete || true
          find . -type d -empty -delete || true

          ./bin/lean --version
          ./bin/lake --version
          ./bin/lean --run /tmp/Basic.lean | tee /tmp/basic-trimmed.out
          grep -Fx '2 + 3 = 5' /tmp/basic-trimmed.out

          cd "$root/mathlib"
          lake env lean --run PortableProbe.lean | tee /tmp/mathlib-trimmed.out
          grep -Fx 'mathlib-ok' /tmp/mathlib-trimmed.out

          mkdir -p "$root/bin" "$root/examples"
          cat > "$root/bin/lean" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          exec "$ROOT/toolchain/bin/lean" "$@"
          EOF
          cat > "$root/bin/lake" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          exec "$ROOT/toolchain/bin/lake" "$@"
          EOF
          cat > "$root/bin/mathlib-lean" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          ROOT=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          cd "$ROOT/mathlib"
          exec "$ROOT/toolchain/bin/lake" env lean "$@"
          EOF
          chmod +x "$root/bin/lean" "$root/bin/lake" "$root/bin/mathlib-lean"
          cp /tmp/Basic.lean "$root/examples/Basic.lean"
          cp PortableProbe.lean "$root/examples/MathlibProbe.lean"
          rm PortableProbe.lean

          cat > "$root/README.md" <<'EOF'
          # Portable Lean 4.32.0 for x86-64 Linux

          This relocatable bundle contains Lean 4.32.0, the complete Mathlib
          v4.32.0 source tree, complete dependency source trees, precompiled
          dependency packages, and a coherent traced subset of Mathlib's root
          precompiled cache covering tactics, real numbers, linear algebra bases,
          and basic differential calculus. Generated C/LLVM objects, static
          archives, `.ilean` metadata, documentation, and bundled Clang are removed.

          Native `leanc` or cache rebuilding requires a system C/C++ toolchain plus
          libc++, libc++abi, and libuv development packages.

              ./bin/lean --run examples/Basic.lean
              ./bin/mathlib-lean --run ../examples/MathlibProbe.lean
          EOF

          cat > "$root/BUILD-REPORT.txt" <<'EOF'
          Lean: v4.32.0
          Mathlib: v4.32.0
          Mathlib cache mode: coherent traced root cache plus precompiled dependencies
          Archive target: less than 470000000 bytes
          EOF
          du -sh "$root/toolchain" "$root/mathlib" "$root/mathlib/.lake" || true

      - name: Package under size cap
        run: |
          set -euxo pipefail
          root="$GITHUB_WORKSPACE/stage/lean-portable"
          out="$GITHUB_WORKSPACE/portable-lean-v4.32.0-x86_64-linux.zip"
          seven=$(command -v 7zz || command -v 7z)
          cd "$GITHUB_WORKSPACE/stage"
          "$seven" a -tzip -mx=5 -mmt=on "$out" lean-portable >/tmp/7zip.log
          size=$(stat -c %s "$out")
          mode='coherent traced root cache plus precompiled dependencies'

          if [ "$size" -ge "$TARGET_ZIP_BYTES" ]; then
            rm -f "$out"
            rm -rf "$root/mathlib/.lake/build"
            mode='complete Mathlib source plus precompiled dependencies'
            cat > "$root/BUILD-REPORT.txt" <<EOF
          Lean: v4.32.0
          Mathlib: v4.32.0
          Mathlib cache mode: $mode
          Archive target: less than $TARGET_ZIP_BYTES bytes
          EOF
            "$seven" a -tzip -mx=5 -mmt=on "$out" lean-portable >/tmp/7zip.log
            size=$(stat -c %s "$out")
          fi

          test "$size" -lt "$TARGET_ZIP_BYTES"
          printf 'Archive bytes: %s\nMathlib cache mode: %s\n' \
            "$size" "$mode" | tee ARCHIVE-METADATA.txt
          sha256sum portable-lean-v4.32.0-x86_64-linux.zip | tee SHA256SUMS
          stat -c '%n %s bytes' portable-lean-v4.32.0-x86_64-linux.zip

      - name: Verify extracted bundle
        run: |
          set -euxo pipefail
          rm -rf verify
          mkdir verify
          unzip -q portable-lean-v4.32.0-x86_64-linux.zip -d verify
          verify/lean-portable/bin/lean --version
          verify/lean-portable/bin/lean --run verify/lean-portable/examples/Basic.lean | tee /tmp/final-basic.out
          grep -Fx '2 + 3 = 5' /tmp/final-basic.out
          if [ -d verify/lean-portable/mathlib/.lake/build ]; then
            (cd verify/lean-portable/mathlib && ../bin/mathlib-lean --run ../examples/MathlibProbe.lean) | tee /tmp/final-mathlib.out
            grep -Fx 'mathlib-ok' /tmp/final-mathlib.out
          fi

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: portable-lean-v4.32.0-x86_64-linux
          path: |
            portable-lean-v4.32.0-x86_64-linux.zip
            SHA256SUMS
            ARCHIVE-METADATA.txt
            stage/lean-portable/BUILD-REPORT.txt
          compression-level: 0
          retention-days: 7
